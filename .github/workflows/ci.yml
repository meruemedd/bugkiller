name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  three-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install
      - name: Build workspaces
        run: npm run build
      - name: Smoke API boot
        run: |
          node apps/api/src/server.js &
          PID=$!
          sleep 1
          curl -fsS http://127.0.0.1:8787/health
          kill $PID
